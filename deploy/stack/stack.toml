# The stack's data (stack.toml, schema 1), after scshafe-dev's template. The host's tools/stack reads
# it as data, never as shell, and rejects an unknown key; `dev check` (DEPLOY-03) checks the same
# schema. Secrets are named here and never valued: the owner's provisioning places them on the host.
schema = 1

[deploy]
image = "ledgefall"                  # the image built from this repository's Dockerfile (last stage: both binaries)
pin = "LEDGEFALL_IMAGE"              # the .env variable stack deploy writes (name:tag)
pin_style = "ref"
dockerfile = "Dockerfile"
containers = ["ledgefall-lobby", "ledgefall-server"]
health = "/api/status"               # the lobby's status, through the tailnet name (it has no /healthz)
ready_attempts = 20
rollback_services = ["lobby", "gameserver"]

[check]
required_health_services = ["lobby"]

[backup]
tailscale = true                     # the node identity (always, with a sidecar)
paths = []                           # no app data: rooms and matches live in memory

[env]
required = ["TS_AUTHKEY", "NPK_PUBLIC_UDP"]   # TS_AUTHKEY: first start only, blanked after the join
generated = ["NPK_CONTROL_SECRET"]
owner = []
